# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# Kill the current window (with confirmation).
bind-key k confirm-before -p "Kill window #W? (y/n)" kill-window

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour208

# copy mode
setw -g mode-style 'fg=black bg=colour208 bold'

# panes
set -g pane-border-style 'fg=colour208'
set -g pane-active-border-style 'fg=colour214'
# Show each pane's current directory name at its top border. Pi stores
# @pi_status per pane; the window-list formats below loop over those statuses
# so they are visible from any other window.
set -g pane-border-status top
# `#h` is tmux's short hostname (equivalent to `hostname -s`), and `b:`
# renders only the basename of pane_current_path. `terminal` uses the terminal
# profile's default foreground/background.
set -g pane-border-format '#[fg=terminal] #h • #{b:pane_current_path} '

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour208 bg=terminal'

set -g status-left ''
set -g status-left-length 10

# Date and clock disabled on the bottom-right status bar.
set -g status-interval 1
# set -g status-right '#[fg=black,bg=colour208,bold] %a %Y-%m-%d %H:%M:%S '
set -g status-right ''
set -g status-right-length 40

setw -g window-status-current-style 'fg=black bg=colour208'
# Window entry: index, Pi indicator, title, then an active/inactive marker.
# @pi_indicator is per-pane; tmux's P: format shows every pane's indicator.
# Pi updates it every 140 ms while working, so tmux redraws the animation
# immediately rather than waiting for status-interval.
setw -g window-status-current-format ' #I #{P:#{@pi_indicator}}#[fg=black]#W #{?window_active,*,-} '

# Only the active window is orange; inactive windows use the terminal
# background so they follow the active light or dark terminal appearance.
setw -g window-status-style 'fg=colour208 bg=terminal'
setw -g window-status-format ' #I #{P:#{@pi_indicator}}#[fg=colour252]#W #[fg=colour208]#{?window_active,*,-} '

setw -g window-status-bell-style 'fg=black bg=colour208 bold'

# messages
set -g message-style 'fg=black bg=colour208 bold'

# Pi suggestions
set -g extended-keys on
set -g extended-keys-format csi-u
